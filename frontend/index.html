<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values on notched iPhones. maximum-scale is deliberately NOT set:
         pinch-zoom is an accessibility affordance and Apple flags removing it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SmartFolio" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="format-detection" content="telephone=no" />
    <title>SmartFolio</title>
    <script>
      // Keep the Figma bridge available for explicit capture URLs without
      // loading a third-party design script during normal app sessions.
      if (window.location.hash.includes('figmacapture=')) {
        const figmaCapture = document.createElement('script')
        figmaCapture.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js'
        figmaCapture.async = true
        document.head.appendChild(figmaCapture)
      }
    </script>
    <meta
      name="description"
      content="SmartFolio — AI investment intelligence platform: guided onboarding, portfolio diagnostics, and an OpenVC-style stock analysis terminal."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
