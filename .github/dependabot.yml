version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # React 19 is a coordinated framework migration. Keep the runtime and
      # type packages on the same major until browser coverage is in place.
      - dependency-name: react
        versions:
          - ">=19.0.0"
      - dependency-name: react-dom
        versions:
          - ">=19.0.0"
      - dependency-name: "@types/react"
        versions:
          - ">=19.0.0"
      - dependency-name: "@types/react-dom"
        versions:
          - ">=19.0.0"
      - dependency-name: react-router
        update-types:
          - version-update:semver-major
      - dependency-name: react-router-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@ionic/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@ionic/react-router"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@emnapi/core"
        # Keep the aligned pair on alpha.3 until stable 2.0.0 is available.
        versions:
          - ">=2.0.0-alpha.4 <2.0.0"
      - dependency-name: "@emnapi/runtime"
        versions:
          - ">=2.0.0-alpha.4 <2.0.0"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Provider majors require a live API smoke test because both SDK lines
      # cross transport and API-contract boundaries.
      - dependency-name: anthropic
        versions:
          - ">=1.0.0"
      - dependency-name: openai
        versions:
          - ">=2.0.0"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
